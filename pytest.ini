[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html

markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests with real services
    e2e: End-to-end tests with running server
